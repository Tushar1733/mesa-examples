name: Validate Mesa Examples

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install system packages for headless rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          pip install \
          "mesa[rec]" \
          "mesa[viz]" \
          scipy \
          matplotlib \
          solara \
          requests \
          pyyaml \
          networkx \
          numpy \
          pandas \
          seaborn \
          jupyter

      - name: Disable GUI backend
        run: |
          echo "MPLBACKEND=Agg" >> $GITHUB_ENV

      - name: Run validator
        run: |
          xvfb-run -a python scripts/validate_examples.py