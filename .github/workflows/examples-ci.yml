name: Validate Mesa Examples

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-using-latest-deps:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install system packages for headless rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Disable GUI backend
        run: |
          echo "MPLBACKEND=Agg" >> $GITHUB_ENV

      - name: Run validator
        run: |
          xvfb-run -a python scripts\latest_validate_examples.py
  validate-using-declared-deps:
   runs-on: ubuntu-latest

   strategy:
     matrix:
       python-version: ["3.14"]

   steps:
     - name: Checkout Repository
       uses: actions/checkout@v4

     - name: Setup Python
       uses: actions/setup-python@v5
       with:
         python-version: ${{ matrix.python-version }}

     - name: Upgrade pip
       run: python -m pip install --upgrade pip

     - name: Install system packages for headless rendering
       run: |
         sudo apt-get update
         sudo apt-get install -y xvfb

     - name: Disable GUI backend
       run: |
         echo "MPLBACKEND=Agg" >> $GITHUB_ENV

     - name: Run validator
       run: |
         xvfb-run -a python scripts\Declared_validate_examples.py