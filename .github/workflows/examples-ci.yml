name: Validate Mesa Examples

on:
  push:
    paths-ignore:
      - "example_validation_results*.json"
      - "health_dashboard.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — validate with latest deps
  # ─────────────────────────────────────────────
  validate-using-latest-deps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip

      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - run: pip install -r requirements.txt

      - run: echo "MPLBACKEND=Agg" >> $GITHUB_ENV

      - name: Run validator
        run: xvfb-run -a python scripts/latest_validate_examples.py

      - name: Verify report exists
        if: always()
        run: |
          FILE="example_validation_results(latest-deps).json"
          if [ ! -s "$FILE" ]; then
            echo "[]" > "$FILE"
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-latest
          path: example_validation_results\(latest-deps\).json


  # ─────────────────────────────────────────────
  # JOB 2 — validate with declared deps
  # ─────────────────────────────────────────────
  validate-using-declared-deps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip

      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb lsof

      - run: pip install requests pyyaml solara

      - run: echo "MPLBACKEND=Agg" >> $GITHUB_ENV

      - run: find examples -type d -name ".venv" -exec rm -rf {} +

      - name: Run validator
        env:
          MESA_VERSION_LABEL: "ci"
        run: python scripts/declared_validate_examples.py --examples-dir examples --timeout 30

      - name: Verify report exists
        if: always()
        run: |
          FILE="example_validation_results(declared-deps).json"
          if [ ! -s "$FILE" ]; then
            echo "[]" > "$FILE"
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-declared
          path: example_validation_results\(declared-deps\).json


  # ─────────────────────────────────────────────
  # JOB 3 — check examples and create issues
  # ─────────────────────────────────────────────
  check-examples:
    needs: [validate-using-latest-deps, validate-using-declared-deps]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pyyaml

      - name: Download latest report
        uses: actions/download-artifact@v4
        with:
          name: validation-report-latest

      - name: Download declared report
        uses: actions/download-artifact@v4
        with:
          name: validation-report-declared

      - name: Declare status
        run: python scripts/declare_status.py

      - name: Generate issues
        run: python scripts/generate_issues.py

      - name: Create or update issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const issues = JSON.parse(fs.readFileSync('issues_to_create.json','utf8'));

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            for (const issue of issues) {

              const found = existing.data.find(i => i.title === issue.title);

              if (found) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: found.number,
                  labels: ["example-health", issue.status]
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issue.title,
                  body: issue.body,
                  labels: ["example-health", issue.status]
                });
              }
            }


  # ─────────────────────────────────────────────
  # JOB 4 — update health dashboard
  # ─────────────────────────────────────────────
  update-dashboard:
    needs: [check-examples]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download latest report
        uses: actions/download-artifact@v4
        with:
          name: validation-report-latest

      - name: Download declared report
        uses: actions/download-artifact@v4
        with:
          name: validation-report-declared

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dashboard
        run: python scripts/generate_dashboard_1.py

      - name: Commit reports + dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add example_validation_results*.json
          git add health_dashboard.md

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "ci: update validation reports and dashboard [skip ci]"
          git push