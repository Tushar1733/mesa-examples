name: Validate Mesa Examples

on:
  push:
    paths-ignore:
      - "example_validation_results*.json"
      - "health_dashboard.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — validate with latest deps
  # ─────────────────────────────────────────────
  validate-using-latest-deps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Disable GUI backend
        run: echo "MPLBACKEND=Agg" >> $GITHUB_ENV

      # continue-on-error: true so that even if some examples fail validation
      # (non-zero exit code), all steps below still run and the report is saved.
      - name: Run validator
        continue-on-error: true
        run: xvfb-run -a python scripts/latest_validate_examples.py

      # If the script crashed before writing the file, create a valid empty fallback
      # so the artifact upload always has something and downstream jobs never get an empty file.
      - name: Verify report exists
        if: always()
        run: |
          FILE="example_validation_results(latest-deps).json"
          if [ ! -f "$FILE" ] || [ ! -s "$FILE" ]; then
            echo "WARNING: $FILE missing or empty — writing fallback."
            echo "[]" > "$FILE"
          else
            echo "OK: $FILE exists ($(wc -c < "$FILE") bytes)"
          fi

      # Upload as artifact — this is the ONLY way data is passed to check-examples.
      # No git commit here; git commits from parallel jobs cause race conditions.
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-latest
          path: "example_validation_results(latest-deps).json"
          if-no-files-found: error


  # ─────────────────────────────────────────────
  # JOB 2 — validate with declared deps
  # ─────────────────────────────────────────────
  validate-using-declared-deps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y lsof

      - name: Install script dependencies
        run: pip install requests pyyaml solara

      - name: Disable GUI backend
        run: echo "MPLBACKEND=Agg" >> $GITHUB_ENV

      - name: Clean stale venvs
        run: find examples -type d -name ".venv" -exec rm -rf {} +

      # continue-on-error: true so that even if some examples fail validation
      # (non-zero exit code), all steps below still run and the report is saved.
      - name: Run validator
        continue-on-error: true
        env:
          MESA_VERSION_LABEL: "ci"
        run: python scripts/declared_validate_examples.py --examples-dir examples --timeout 30

      # If the script crashed before writing the file, create a valid empty fallback
      # so the artifact upload always has something and downstream jobs never get an empty file.
      - name: Verify report exists
        if: always()
        run: |
          FILE="example_validation_results(declared-deps).json"
          if [ ! -f "$FILE" ] || [ ! -s "$FILE" ]; then
            echo "WARNING: $FILE missing or empty — writing fallback."
            echo "[]" > "$FILE"
          else
            echo "OK: $FILE exists ($(wc -c < "$FILE") bytes)"
          fi

      # Upload as artifact — this is the ONLY way data is passed to check-examples.
      # No git commit here; git commits from parallel jobs cause race conditions.
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-declared
          path: "example_validation_results(declared-deps).json"
          if-no-files-found: error


  # ─────────────────────────────────────────────
  # JOB 3 — check examples and create issues
  # ─────────────────────────────────────────────
  check-examples:
    needs: [validate-using-latest-deps, validate-using-declared-deps]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests pyyaml

      # Download artifacts directly into the workspace root so declare_status.py
      # finds them at the exact paths it expects.
      - name: Download latest-deps report
        uses: actions/download-artifact@v4
        with:
          name: validation-report-latest
          path: .
        continue-on-error: true

      - name: Download declared-deps report
        uses: actions/download-artifact@v4
        with:
          name: validation-report-declared
          path: .
        continue-on-error: true

      # Ensure both files are present and valid before running any scripts.
      - name: Validate downloaded reports
        run: |
          for f in \
            "example_validation_results(latest-deps).json" \
            "example_validation_results(declared-deps).json"
          do
            if [ ! -s "$f" ]; then
              echo "WARNING: '$f' missing or empty — writing fallback."
              echo "[]" > "$f"
            else
              python -c "import json; json.load(open('$f'))" 2>/dev/null \
                && echo "OK: '$f' is valid JSON ($(wc -c < "$f") bytes)." \
                || { echo "WARNING: '$f' is invalid JSON — writing fallback."; echo "[]" > "$f"; }
            fi
          done

      - name: Declare status
        run: python scripts/declare_status.py

      - name: Generate issues
        run: python scripts/generate_issues.py

      # Commit both JSON reports to the repo in a single push — done here in
      # check-examples (sequential, no race condition) instead of in the two
      # parallel validator jobs where concurrent pushes caused failures.
      - name: Commit validation reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "example_validation_results(latest-deps).json" \
                  "example_validation_results(declared-deps).json"
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping."
          else
            git pull --rebase origin main
            git commit -m "ci: update validation reports [skip ci]"
            git push
          fi

      - name: Create or update issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const issues = JSON.parse(
              fs.readFileSync('issues_to_create.json', 'utf8')
            );

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            for (const issue of issues) {
              const existing = existingIssues.data.find(
                i => i.title === issue.title
              );

              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  labels: ["example-health", issue.status]
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issue.title,
                  body: issue.body,
                  labels: ["example-health", issue.status]
                });
              }
            }


  # ─────────────────────────────────────────────
  # JOB 4 — update health dashboard
  # ─────────────────────────────────────────────
  update-dashboard:
    needs: [check-examples]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pull the JSON files committed by check-examples before generating dashboard.
      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dashboard
        run: python scripts/generate_dashboard_1.py

      - name: Commit dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add health_dashboard.md
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping."
            exit 0
          fi
          git commit -m "ci: update health dashboard [skip ci]"
          git push