name: Validate Examples

on:
  push:
    branches: ["main"]
    paths:
      - "examples/**"
      - "scripts/validate_examples.py"
      - ".github/workflows/examples_ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "examples/**"
      - "scripts/validate_examples.py"
      - ".github/workflows/examples_ci.yml"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      timeout:
        description: "Per-example timeout in seconds"
        required: false
        default: "30"

jobs:
  validate:
    name: Validate Examples (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false          # run all matrix entries even if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      # Used by validate_examples.py to auto-name the JSON report
      MESA_VERSION_LABEL: "py${{ matrix.python-version }}"
      # Ensure Python output is never buffered in CI logs
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # Force non-interactive matplotlib and suppress any GUI attempts
      MPLBACKEND: "Agg"
      DISPLAY: ""

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # ── 3. Install mesa (from repo) + validator dependencies ─────────────────
      - name: Install mesa (editable) and script dependencies
        run: |
          python -m pip install --upgrade pip
          # Install mesa from the repo root in editable mode
          pip install -e ".[viz]" --quiet
          # Validator script needs requests and pyyaml
          pip install requests pyyaml --quiet

      # ── 4. Install solara ────────────────────────────────────────────────────
      - name: Install solara
        run: pip install solara --quiet

      # ── 5. Run validator ─────────────────────────────────────────────────────
      - name: Validate examples
        timeout-minutes: 30
        run: |
          python scripts/validate_examples.py \
            --examples-dir examples \
            --timeout ${{ github.event.inputs.timeout || '30' }}

      # ── 6. Upload JSON report as artifact ────────────────────────────────────
      - name: Upload validation report
        if: always()           # upload even when examples fail
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-py${{ matrix.python-version }}
          path: example_validation_results_py${{ matrix.python-version }}.json
          retention-days: 30

      # ── 7. Print report path for easy log navigation ─────────────────────────
      - name: Report summary
        if: always()
        run: |
          echo "### Validation complete for Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "JSON report uploaded as: validation-report-py${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY